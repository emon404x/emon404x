<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 255, 102, 0.05)" stroke-width="1.5"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Filters for Neon Glow -->
    <filter id="neonGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanbeam {
      0% { transform: translateY(-10px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(290px); opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.2; }
    }
    @keyframes pulseGlow {
      0%, 100% { stroke-opacity: 0.6; filter: drop-shadow(0 0 2px #00FF66); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #00FF66); }
    }
    @keyframes glitchText {
      0%, 92%, 100% { transform: translate(0, 0); }
      93% { transform: translate(-2px, 1px); }
      95% { transform: translate(2px, -1px); }
      97% { transform: translate(-1px, -1px); }
    }
    @keyframes hudPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    .hud-text {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', Consolas;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
    }
    .title-main {
      font-family: 'Courier New', Courier, monospace, 'Segoe UI', system-ui, sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 6px;
    }
    .title-sub {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', Consolas;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .tag-text {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', Consolas;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .scan-beam {
      animation: scanbeam 4s ease-in-out infinite;
    }
    .blinker {
      animation: blink 1.2s infinite;
    }
    .neon-border {
      animation: pulseGlow 3s infinite;
    }
    .glitchy {
      animation: glitchText 4s infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="920" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="920" height="280" rx="14" fill="url(#grid)"/>
  <rect width="920" height="280" rx="14" fill="url(#scanlines)"/>

  <!-- Scanning Beam Effect -->
  <line x1="10" y1="0" x2="910" y2="0" stroke="url(#neonGreenGrad)" stroke-width="2" class="scan-beam" opacity="0.6"/>

  <!-- Cybernetic Outer Frame -->
  <rect x="8" y="8" width="904" height="264" rx="10" fill="none" stroke="#1f293d" stroke-width="1.5"/>
  <rect x="14" y="14" width="892" height="252" rx="8" fill="none" stroke="url(#neonGreenGrad)" stroke-width="1.5" class="neon-border"/>

  <!-- Corner Brackets -->
  <!-- Top-Left -->
  <path d="M 10 32 L 10 10 L 32 10" fill="none" stroke="#00FF66" stroke-width="3"/>
  <!-- Top-Right -->
  <path d="M 910 32 L 910 10 L 888 10" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <!-- Bottom-Left -->
  <path d="M 10 248 L 10 270 L 32 270" fill="none" stroke="#A855F7" stroke-width="3"/>
  <!-- Bottom-Right -->
  <path d="M 910 248 L 910 270 L 888 270" fill="none" stroke="#EC4899" stroke-width="3"/>

  <!-- Window Header Bar -->
  <rect x="14" y="14" width="892" height="36" rx="8" fill="rgba(13, 20, 36, 0.85)"/>
  <line x1="14" y1="50" x2="906" y2="50" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Terminal Window Buttons -->
  <circle cx="34" cy="32" r="5" fill="#EF4444"/>
  <circle cx="50" cy="32" r="5" fill="#F59E0B"/>
  <circle cx="66" cy="32" r="5" fill="#10B981"/>

  <!-- Header HUD Information -->
  <text x="88" y="36" fill="#00FF66" class="hud-text">
    404X_OS // BOOT PROTOCOL v2.4
  </text>
  <text x="460" y="36" text-anchor="middle" fill="#8B949E" class="hud-text">
    [ SYSTEM: <tspan fill="#00F0FF">ONLINE</tspan> ] • [ KERNEL: <tspan fill="#A855F7">EXPERIMENTAL</tspan> ]
  </text>
  <circle cx="810" cy="32" r="4" fill="#00FF66" class="blinker"/>
  <text x="822" y="36" fill="#00FF66" class="hud-text">LIVE</text>
  <text x="862" y="36" fill="#8B949E" class="hud-text">42ms</text>

  <!-- Center Content Area -->
  <g class="glitchy">
    <!-- Small Pre-header -->
    <text x="460" y="90" text-anchor="middle" fill="#00F0FF" class="tag-text">
      &gt; INITIALIZING PLAYER 01 INTERFACE...
    </text>

    <!-- Main Name Header -->
    <text x="460" y="142" text-anchor="middle" fill="url(#neonGreenGrad)" class="title-main" filter="url(#neonGlowGreen)">
      EmOn // 404X
    </text>

    <!-- Subtitle -->
    <text x="460" y="174" text-anchor="middle" fill="#FFFFFF" class="title-sub">
      404: SERIOUS DEVELOPER NOT FOUND
    </text>

    <!-- Punchline / Core Identity -->
    <text x="460" y="202" text-anchor="middle" fill="#A855F7" class="tag-text">
      JUST A CASUAL DEVELOPER BUILDING RANDOM PROJECTS &amp; ENDLESS SIDE QUESTS
    </text>
  </g>

  <!-- Bottom Telemetry Chips -->
  <g transform="translate(40, 222)">
    <!-- Chip 1: Status -->
    <rect x="0" y="0" width="180" height="26" rx="4" fill="rgba(0, 255, 102, 0.08)" stroke="#00FF66" stroke-width="1"/>
    <circle cx="14" cy="13" r="3" fill="#00FF66" class="blinker"/>
    <text x="24" y="17" fill="#00FF66" class="tag-text">QUEST: IN PROGRESS</text>

    <!-- Chip 2: Coffee -->
    <rect x="195" y="0" width="165" height="26" rx="4" fill="rgba(168, 85, 247, 0.08)" stroke="#A855F7" stroke-width="1"/>
    <text x="210" y="17" fill="#A855F7" class="tag-text">☕ COFFEE: 99.4%</text>

    <!-- Chip 3: Bugs -->
    <rect x="375" y="0" width="195" height="26" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="1"/>
    <text x="390" y="17" fill="#00F0FF" class="tag-text">👾 BUGS: FEATURES NOW</text>

    <!-- Chip 4: Mode -->
    <rect x="585" y="0" width="170" height="26" rx="4" fill="rgba(236, 72, 153, 0.08)" stroke="#EC4899" stroke-width="1"/>
    <text x="600" y="17" fill="#EC4899" class="tag-text">⚡ MODE: CHAOTIC-GOOD</text>

    <!-- Chip 5: Ping / Git -->
    <rect x="770" y="0" width="70" height="26" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="#4B5563" stroke-width="1"/>
    <text x="785" y="17" fill="#9CA3AF" class="tag-text">git ++</text>
  </g>
</svg>
