<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060b"/>
      <stop offset="50%" stop-color="#090b14"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>

    <!-- Radial Nebula Ambient Orbs -->
    <radialGradient id="nebulaPurple" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaGreen" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerCore" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Moniker Gradient -->
    <linearGradient id="neonTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Cyber Border Gradient -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF66" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
      <circle cx="30" cy="0" r="0.75" fill="rgba(0, 240, 255, 0.12)"/>
    </pattern>

    <!-- Glowing Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserPulse {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes borderPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace;
    }
    .font-sans {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .live-dot { animation: pulseLed 1.2s infinite; }
    .frame-glow { animation: borderPulse 3s ease-in-out infinite; }
    .laser-line { animation: laserPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="960" height="250" rx="14" fill="url(#bgObsidian)"/>
  <rect width="960" height="250" rx="14" fill="url(#nebulaPurple)"/>
  <rect width="960" height="250" rx="14" fill="url(#nebulaGreen)"/>
  <rect width="960" height="250" rx="14" fill="url(#centerCore)"/>
  <rect width="960" height="250" rx="14" fill="url(#cyberGrid)"/>

  <!-- Outer Cybernetic Border -->
  <rect x="8" y="8" width="944" height="234" rx="12" fill="none" stroke="url(#frameBorder)" stroke-width="1.2" class="frame-glow"/>
  <rect x="13" y="13" width="934" height="224" rx="10" fill="rgba(10, 13, 22, 0.25)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

  <!-- High-Tech Corner Brackets -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#00FF66" stroke-width="2.5"/>
  <path d="M 948 30 L 948 12 L 930 12" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 12 220 L 12 238 L 30 238" fill="none" stroke="#A855F7" stroke-width="2.5"/>
  <path d="M 948 220 L 948 238 L 930 238" fill="none" stroke="#EC4899" stroke-width="2.5"/>

  <!-- Top Window Rail -->
  <g transform="translate(32, 28)">
    <!-- Window Dots -->
    <circle cx="0" cy="0" r="4.5" fill="#EF4444"/>
    <circle cx="14" cy="0" r="4.5" fill="#F59E0B"/>
    <circle cx="28" cy="0" r="4.5" fill="#10B981"/>

    <!-- Left Header -->
    <text x="50" y="4" fill="#00FF66" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">
      404X_OS <tspan fill="#64748B">//</tspan> BOOT_SEQUENCE v3.4
    </text>

    <!-- Center System Status -->
    <text x="448" y="4" text-anchor="middle" fill="#94A3B8" class="font-mono" font-size="11" letter-spacing="2">
      STATUS: <tspan fill="#00F0FF" font-weight="700">ONLINE</tspan>  •  MODE: <tspan fill="#A855F7" font-weight="700">EXPERIMENTAL</tspan>
    </text>

    <!-- Right Live Status -->
    <circle cx="868" cy="0" r="3.5" fill="#00FF66" class="live-dot"/>
    <text x="880" y="4" fill="#00FF66" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">LIVE</text>
  </g>

  <!-- Rail Divider with Laser Scan -->
  <line x1="20" y1="42" x2="940" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <g clip-path="url(#railClip)">
    <line x1="0" y1="42" x2="250" y2="42" stroke="url(#laserBeam)" stroke-width="2" class="laser-line"/>
  </g>

  <!-- CENTERED MAIN HERO CONTENT -->
  <g transform="translate(480, 56)">
    
    <!-- Top Identity Chip -->
    <g transform="translate(0, 10)">
      <rect x="-110" y="0" width="220" height="22" rx="11" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="1"/>
      <circle cx="-96" cy="11" r="2.5" fill="#A855F7" class="live-dot"/>
      <text x="0" y="15" text-anchor="middle" fill="#C084FC" class="font-mono" font-size="10" font-weight="700" letter-spacing="2">
        DEV IDENTITY // EMON
      </text>
    </g>

    <!-- Big Bold Moniker -->
    <text x="0" y="74" text-anchor="middle" fill="url(#neonTextGrad)" class="font-sans" font-size="52" font-weight="900" letter-spacing="3" filter="url(#neonGlow)">
      EmOn <tspan fill="#00FF66">//</tspan> 404X
    </text>

    <!-- Sleek Core Subtitle -->
    <text x="0" y="102" text-anchor="middle" fill="#FFFFFF" class="font-mono" font-size="15" font-weight="800" letter-spacing="3">
      404: SERIOUS DEVELOPER NOT FOUND
    </text>

    <!-- Punchline / Identity -->
    <text x="0" y="124" text-anchor="middle" fill="#94A3B8" class="font-mono" font-size="11.5" font-weight="500" letter-spacing="1">
      Building random platforms, breaking things, and embarking on endless coding side quests.
    </text>

    <!-- Bottom Modern Capsule Pills -->
    <g transform="translate(0, 142)">
      <!-- Pill 1: Quest -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="150" height="26" rx="6" fill="rgba(0, 255, 102, 0.08)" stroke="#00FF66" stroke-width="1"/>
        <text x="75" y="17" text-anchor="middle" fill="#00FF66" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">
          ✦ QUEST: ACTIVE
        </text>
      </g>

      <!-- Pill 2: Fuel -->
      <g transform="translate(-155, 0)">
        <rect x="0" y="0" width="150" height="26" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="#A855F7" stroke-width="1"/>
        <text x="75" y="17" text-anchor="middle" fill="#C084FC" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">
          ☕ PURPLE FUEL: 99%
        </text>
      </g>

      <!-- Pill 3: Bugs -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="160" height="26" rx="6" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="1"/>
        <text x="80" y="17" text-anchor="middle" fill="#00F0FF" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">
          👾 BUGS: FEATURES NOW
        </text>
      </g>

      <!-- Pill 4: Mode -->
      <g transform="translate(185, 0)">
        <rect x="0" y="0" width="150" height="26" rx="6" fill="rgba(236, 72, 153, 0.08)" stroke="#EC4899" stroke-width="1"/>
        <text x="75" y="17" text-anchor="middle" fill="#F472B6" class="font-mono" font-size="10" font-weight="700" letter-spacing="1">
          ⚡ MODE: CHAOTIC-GOOD
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry Coordinates -->
  <text x="32" y="234" fill="rgba(255, 255, 255, 0.22)" class="font-mono" font-size="9" letter-spacing="1.5">
    LAT: 23.8103° N // LON: 90.4125° E // SYS_ID: EMON_404X
  </text>
  <text x="928" y="234" text-anchor="end" fill="rgba(255, 255, 255, 0.22)" class="font-mono" font-size="9" letter-spacing="1.5">
    BUILD: 2026.10 // MODE: CHAOTIC_CREATIVE
  </text>
</svg>
