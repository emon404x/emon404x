<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="footerNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <pattern id="footerScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(168, 85, 247, 0.06)" stroke-width="1.5"/>
    </pattern>

    <filter id="footerGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blinkSlow {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }
    @keyframes pulseFooter {
      0%, 100% { filter: drop-shadow(0 0 2px #00FF66); }
      50% { filter: drop-shadow(0 0 7px #00FF66); }
    }
    @keyframes floatPixel {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .f-title {
      font-family: 'Courier New', Courier, monospace, 'Segoe UI', system-ui, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
    }
    .f-sub {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', Consolas;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .f-tag {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', Consolas;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
    }
    .blink-coin {
      animation: blinkSlow 1.4s infinite;
    }
    .glow-box {
      animation: pulseFooter 3s infinite;
    }
    .floating-badge {
      animation: floatPixel 3s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#footerBg)"/>
  <rect width="900" height="200" rx="12" fill="url(#footerScan)"/>

  <!-- Border -->
  <rect x="10" y="10" width="880" height="180" rx="8" fill="none" stroke="url(#footerNeon)" stroke-width="1.5" class="glow-box"/>

  <!-- Corner cuts -->
  <path d="M 6 26 L 6 6 L 26 6" fill="none" stroke="#A855F7" stroke-width="2.5"/>
  <path d="M 894 26 L 894 6 L 874 6" fill="none" stroke="#00FF66" stroke-width="2.5"/>
  <path d="M 6 174 L 6 194 L 26 194" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 894 174 L 894 194 L 874 194" fill="none" stroke="#A855F7" stroke-width="2.5"/>

  <!-- Top bar info -->
  <text x="30" y="32" fill="#8B949E" class="f-tag">SESSION: 404X_STATION // EXIT_CODE: 0</text>
  <text x="870" y="32" text-anchor="end" fill="#00FF66" class="f-tag">AUTOSAVE: COMPLETE ✓</text>

  <!-- Center Messages -->
  <g class="floating-badge">
    <text x="450" y="80" text-anchor="middle" fill="#00FF66" class="f-title" filter="url(#footerGlow)">
      👾 404X OS // SHUTDOWN? CANCELLED.
    </text>

    <text x="450" y="112" text-anchor="middle" fill="#FFFFFF" class="f-sub">
      QUEST PAUSED. MORE EXPERIMENTS LOADING IN BACKGROUND...
    </text>
  </g>

  <!-- Arcade Prompt -->
  <g transform="translate(450, 150)" class="blink-coin">
    <rect x="-180" y="-16" width="360" height="28" rx="6" fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="1"/>
    <text x="0" y="2" text-anchor="middle" fill="#00F0FF" class="f-tag">
      ★ INSERT COFFEE TO RESUME // STAR THE REPO ★
    </text>
  </g>

  <!-- Bottom micro-credits -->
  <text x="450" y="182" text-anchor="middle" fill="#6B7280" class="f-tag">
    THANKS FOR VISITING EMON'S CORNER OF CYBERSPACE
  </text>
</svg>
