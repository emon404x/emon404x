<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="210">
  <defs>
    <linearGradient id="footerModernBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="50%" stop-color="#0D111D"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <linearGradient id="footerGlowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="35%" stop-color="#00D2FF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <filter id="fGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, sans-serif; }
    @keyframes pulseCoin { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }
    @keyframes blinkLed { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.2; } }
    .pulsing-btn { animation: pulseCoin 2.5s ease-in-out infinite; transform-origin: center; }
    .led { animation: blinkLed 1.2s infinite; }
  </style>

  <!-- Container -->
  <rect width="960" height="210" rx="16" fill="url(#footerModernBg)"/>
  <rect x="8" y="8" width="944" height="194" rx="12" fill="none" stroke="url(#footerGlowLine)" stroke-width="1.2" opacity="0.8"/>
  <rect x="14" y="14" width="932" height="182" rx="10" fill="rgba(255, 255, 255, 0.015)"/>

  <!-- Corner cuts -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#00F5A0" stroke-width="2"/>
  <path d="M 948 30 L 948 12 L 930 12" fill="none" stroke="#00D2FF" stroke-width="2"/>
  <path d="M 12 180 L 12 198 L 30 198" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <path d="M 948 180 L 948 198 L 930 198" fill="none" stroke="#00D2FF" stroke-width="2"/>

  <!-- Top Status Bar -->
  <g transform="translate(32, 34)">
    <circle cx="0" cy="0" r="3.5" fill="#00F5A0" class="led"/>
    <text x="12" y="3.5" fill="#64748B" class="mono" font-size="10.5" font-weight="600" letter-spacing="1">
      SESSION: 404X_STANDBY // AUTO_SAVE: COMPLETE
    </text>
    <text x="896" y="3.5" text-anchor="end" fill="#00D2FF" class="mono" font-size="10.5" font-weight="700">
      EXIT CODE: 0 (NOMINAL)
    </text>
  </g>

  <!-- Center Big Heading -->
  <g transform="translate(480, 88)">
    <text x="0" y="0" text-anchor="middle" fill="#00F5A0" class="sans" font-size="28" font-weight="900" letter-spacing="4" filter="url(#fGlow)">
      👾 404X OS // SHUTDOWN? CANCELLED.
    </text>
    <text x="0" y="28" text-anchor="middle" fill="#F8FAFC" class="mono" font-size="13" font-weight="600" letter-spacing="2">
      QUEST PAUSED. MORE EXPERIMENTS BREWING IN BACKGROUND...
    </text>
  </g>

  <!-- Interactive Looking Coin Pill -->
  <g transform="translate(480, 156)" class="pulsing-btn">
    <rect x="-190" y="-15" width="380" height="30" rx="15" fill="rgba(0, 210, 255, 0.1)" stroke="#00D2FF" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#00D2FF" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">
      ★ PRESS STAR ON GITHUB // NEXT QUEST SOON ★
    </text>
  </g>

  <text x="480" y="196" text-anchor="middle" fill="#64748B" class="mono" font-size="10" letter-spacing="1">
    THANKS FOR VISITING EMON'S CORNER OF CYBERSPACE
  </text>
</svg>
