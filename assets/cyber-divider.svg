<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00FF66" stop-opacity="0.8"/>
      <stop offset="48%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="52%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00FF66" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0"/>
    </linearGradient>

    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDiv {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00F0FF); }
    }
    @keyframes rotateDiamond {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .divider-line {
      animation: pulseDiv 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Left Line -->
  <line x1="0" y1="12" x2="410" y2="12" stroke="url(#divGrad)" stroke-width="2" class="divider-line"/>

  <!-- Left Accent Dots -->
  <circle cx="390" cy="12" r="2" fill="#00FF66"/>
  <circle cx="400" cy="12" r="3" fill="#00F0FF"/>

  <!-- Center Hexagon / Chip Node -->
  <g transform="translate(450, 12)">
    <polygon points="0,-8 10,-3 10,4 0,9 -10,4 -10,-3" fill="#0D1117" stroke="#00F0FF" stroke-width="1.5" filter="url(#divGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#00FF66"/>
  </g>

  <!-- Right Accent Dots -->
  <circle cx="500" cy="12" r="3" fill="#00F0FF"/>
  <circle cx="510" cy="12" r="2" fill="#A855F7"/>

  <!-- Right Line -->
  <line x1="490" y1="12" x2="900" y2="12" stroke="url(#divGrad)" stroke-width="2" class="divider-line"/>
</svg>
