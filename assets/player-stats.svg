<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" width="100%" height="210">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#120c22"/>
    </linearGradient>

    <linearGradient id="hpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>

    <linearGradient id="manaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes barPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .stat-label {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', Consolas;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .stat-val {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', Consolas;
      font-size: 10px;
      font-weight: 600;
    }
    .card-border {
      stroke: #252e42;
      stroke-width: 1.5;
    }
    .cursor {
      animation: cursorBlink 1s infinite;
    }
  </style>

  <!-- Card Background -->
  <rect width="460" height="210" rx="10" fill="url(#cardBg)" stroke="#232d42" stroke-width="1.5"/>

  <!-- Top Cyber Bar -->
  <rect x="0" y="0" width="460" height="28" rx="10" fill="#141c2e"/>
  <rect x="0" y="20" width="460" height="8" fill="#141c2e"/>
  <line x1="0" y1="28" x2="460" y2="28" stroke="#00FF66" stroke-width="1" stroke-opacity="0.5"/>

  <text x="14" y="19" fill="#00FF66" class="stat-label">PLAYER 01 // DOSSIER</text>
  <text x="446" y="19" text-anchor="end" fill="#A855F7" class="stat-label">LVL: 404</text>

  <!-- Player Attributes -->
  <g transform="translate(18, 48)">
    <text x="0" y="0" fill="#9CA3AF" class="stat-label">CLASS:</text>
    <text x="80" y="0" fill="#00F0FF" class="stat-label">Rogue Code Sorcerer</text>

    <text x="0" y="22" fill="#9CA3AF" class="stat-label">SPECIALTY:</text>
    <text x="80" y="22" fill="#F3F4F6" class="stat-label">Endless Side Quests &amp; Clean Builds</text>

    <text x="0" y="44" fill="#9CA3AF" class="stat-label">PASSIVE:</text>
    <text x="80" y="44" fill="#EC4899" class="stat-label">Accidental Debugging (+50 Insight)</text>
  </g>

  <!-- Stat Bars -->
  <!-- HP Bar -->
  <g transform="translate(18, 115)">
    <text x="0" y="0" fill="#10B981" class="stat-label">HP [COFFEE]</text>
    <text x="424" y="0" text-anchor="end" fill="#10B981" class="stat-val">82%</text>
    <rect x="0" y="6" width="424" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="6" width="348" height="8" rx="4" fill="url(#hpGrad)"/>
  </g>

  <!-- MANA Bar -->
  <g transform="translate(18, 147)">
    <text x="0" y="0" fill="#A855F7" class="stat-label">MANA [CURIOSITY]</text>
    <text x="424" y="0" text-anchor="end" fill="#A855F7" class="stat-val">100%</text>
    <rect x="0" y="6" width="424" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="6" width="424" height="8" rx="4" fill="url(#manaGrad)"/>
  </g>

  <!-- EXP Bar -->
  <g transform="translate(18, 179)">
    <text x="0" y="0" fill="#00F0FF" class="stat-label">EXP [LEARNING]</text>
    <text x="424" y="0" text-anchor="end" fill="#00F0FF" class="stat-val">9999 / ∞</text>
    <rect x="0" y="6" width="424" height="8" rx="4" fill="#1e293b"/>
    <rect x="0" y="6" width="390" height="8" rx="4" fill="url(#xpGrad)"/>
  </g>
</svg>
