<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="220">
  <defs>
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#111827" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1035" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="hpModern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>

    <linearGradient id="manaModern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="expModern" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, sans-serif; }
    @keyframes pulseCardDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .p-dot { animation: pulseCardDot 1.4s infinite; }
  </style>

  <!-- Main Card Container -->
  <rect width="540" height="220" rx="14" fill="url(#cardGlass)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>
  <rect x="6" y="6" width="528" height="208" rx="10" fill="none" stroke="rgba(0, 255, 102, 0.15)" stroke-width="1"/>

  <!-- Top Cyber Bar -->
  <rect x="0" y="0" width="540" height="34" rx="14" fill="rgba(30, 41, 59, 0.5)"/>
  <rect x="0" y="24" width="540" height="10" fill="rgba(30, 41, 59, 0.5)"/>
  <line x1="0" y1="34" x2="540" y2="34" stroke="rgba(0, 255, 102, 0.3)" stroke-width="1"/>

  <!-- Status indicators -->
  <circle cx="20" cy="17" r="4" fill="#00FF66" class="p-dot"/>
  <text x="32" y="21" fill="#00FF66" class="mono" font-size="11" font-weight="700" letter-spacing="1.5">
    PILOT DOSSIER // EMON
  </text>
  <rect x="420" y="7" width="105" height="20" rx="10" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="1"/>
  <text x="472" y="21" text-anchor="middle" fill="#C084FC" class="mono" font-size="10" font-weight="700">
    LVL: 404X
  </text>

  <!-- Player Meta Info -->
  <g transform="translate(20, 56)">
    <text x="0" y="0" fill="#64748B" class="mono" font-size="10" font-weight="700">ROLE:</text>
    <text x="75" y="0" fill="#F8FAFC" class="mono" font-size="10" font-weight="600">Full-Stack &amp; Systems Explorer</text>

    <text x="0" y="22" fill="#64748B" class="mono" font-size="10" font-weight="700">SPECIALTY:</text>
    <text x="75" y="22" fill="#00F0FF" class="mono" font-size="10" font-weight="600">Turning Ideas into Working Platforms</text>

    <text x="0" y="44" fill="#64748B" class="mono" font-size="10" font-weight="700">PASSIVE:</text>
    <text x="75" y="44" fill="#EC4899" class="mono" font-size="10" font-weight="600">Accidental Debugging (+100 Persistence)</text>
  </g>

  <!-- Telemetry Gauges -->
  <!-- HP -->
  <g transform="translate(20, 126)">
    <text x="0" y="0" fill="#10B981" class="mono" font-size="10" font-weight="700">HP [COFFEE LEVEL]</text>
    <text x="500" y="0" text-anchor="end" fill="#00FF66" class="mono" font-size="10" font-weight="700">84%</text>
    <rect x="0" y="6" width="500" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="0" y="6" width="420" height="7" rx="3.5" fill="url(#hpModern)"/>
  </g>

  <!-- MANA -->
  <g transform="translate(20, 156)">
    <text x="0" y="0" fill="#A855F7" class="mono" font-size="10" font-weight="700">MANA [CURIOSITY &amp; TINKERING]</text>
    <text x="500" y="0" text-anchor="end" fill="#D946EF" class="mono" font-size="10" font-weight="700">100%</text>
    <rect x="0" y="6" width="500" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="0" y="6" width="500" height="7" rx="3.5" fill="url(#manaModern)"/>
  </g>

  <!-- EXP -->
  <g transform="translate(20, 186)">
    <text x="0" y="0" fill="#00F0FF" class="mono" font-size="10" font-weight="700">EXP [EXPERIMENTS &amp; COMMITS]</text>
    <text x="500" y="0" text-anchor="end" fill="#38BDF8" class="mono" font-size="10" font-weight="700">9999 / ∞</text>
    <rect x="0" y="6" width="500" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="0" y="6" width="465" height="7" rx="3.5" fill="url(#expModern)"/>
  </g>
</svg>
