<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="dossierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b14"/>
      <stop offset="50%" stop-color="#0e101c"/>
      <stop offset="100%" stop-color="#080911"/>
    </linearGradient>

    <!-- Gauge Gradients -->
    <linearGradient id="hpGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>

    <linearGradient id="manaGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="expGauge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="dossierBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, sans-serif; }
    @keyframes pulseLed { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .live-led { animation: pulseLed 1.3s infinite; }
  </style>

  <!-- Container Box -->
  <rect width="960" height="170" rx="12" fill="url(#dossierBg)"/>
  <rect x="6" y="6" width="948" height="158" rx="10" fill="none" stroke="url(#dossierBorder)" stroke-width="1.2"/>
  <rect x="10" y="10" width="940" height="150" rx="8" fill="rgba(255, 255, 255, 0.01)"/>

  <!-- Top Cyber Ribbon -->
  <rect x="6" y="6" width="948" height="26" rx="10" fill="rgba(30, 41, 59, 0.6)"/>
  <rect x="6" y="22" width="948" height="10" fill="rgba(30, 41, 59, 0.6)"/>
  <line x1="6" y1="32" x2="954" y2="32" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <circle cx="26" cy="19" r="3.5" fill="#00FF66" class="live-led"/>
  <text x="38" y="23" fill="#00FF66" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.5">
    PILOT TELEMETRY // STATS_v3.2
  </text>
  <text x="934" y="23" text-anchor="end" fill="#C084FC" class="mono" font-size="10.5" font-weight="700" letter-spacing="1">
    LEVEL: 404X [UNLOCKED]
  </text>

  <!-- LEFT PANEL: Attributes & Specs (x: 28) -->
  <g transform="translate(28, 52)">
    <text x="0" y="16" fill="#64748B" class="mono" font-size="10.5" font-weight="700">CLASS:</text>
    <text x="88" y="16" fill="#F8FAFC" class="mono" font-size="11" font-weight="600">Full-Stack &amp; Systems Explorer</text>

    <text x="0" y="44" fill="#64748B" class="mono" font-size="10.5" font-weight="700">SPECIALTY:</text>
    <text x="88" y="44" fill="#00F0FF" class="mono" font-size="11" font-weight="600">Turning Ideas into Working Platforms</text>

    <text x="0" y="72" fill="#64748B" class="mono" font-size="10.5" font-weight="700">PASSIVE:</text>
    <text x="88" y="72" fill="#EC4899" class="mono" font-size="11" font-weight="600">Accidental Debugging (+100 Persistence)</text>
  </g>

  <!-- Vertical Divider (x: 440) -->
  <line x1="440" y1="46" x2="440" y2="150" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- RIGHT PANEL: Visual Telemetry Gauges (x: 465 to 925) -->
  <g transform="translate(465, 52)">
    <!-- HP Gauge -->
    <g transform="translate(0, 0)">
      <text x="0" y="10" fill="#10B981" class="mono" font-size="10" font-weight="700">HP [COFFEE LEVEL]</text>
      <text x="460" y="10" text-anchor="end" fill="#00FF66" class="mono" font-size="10.5" font-weight="700">84%</text>
      <rect x="0" y="16" width="460" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="0" y="16" width="386" height="7" rx="3.5" fill="url(#hpGauge)"/>
    </g>

    <!-- MANA Gauge -->
    <g transform="translate(0, 30)">
      <text x="0" y="10" fill="#A855F7" class="mono" font-size="10" font-weight="700">MANA [CURIOSITY &amp; TINKERING]</text>
      <text x="460" y="10" text-anchor="end" fill="#D946EF" class="mono" font-size="10.5" font-weight="700">100%</text>
      <rect x="0" y="16" width="460" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="0" y="16" width="460" height="7" rx="3.5" fill="url(#manaGauge)"/>
    </g>

    <!-- EXP Gauge -->
    <g transform="translate(0, 60)">
      <text x="0" y="10" fill="#00F0FF" class="mono" font-size="10" font-weight="700">EXP [EXPERIMENTS &amp; COMMITS]</text>
      <text x="460" y="10" text-anchor="end" fill="#38BDF8" class="mono" font-size="10.5" font-weight="700">9999 / ∞</text>
      <rect x="0" y="16" width="460" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="0" y="16" width="435" height="7" rx="3.5" fill="url(#expGauge)"/>
    </g>
  </g>
</svg>
